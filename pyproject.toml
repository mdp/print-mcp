[project]
name = "print-mcp"
version = "0.1.0"
description = "A bearer-protected MCP server that prints Markdown to an IPP printer"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4",
  "beautifulsoup4>=4.13,<5",
  "bleach>=6.2,<7",
  "defusedxml>=0.7,<1",
  "markdown-it-py[linkify,plugins]>=4,<5",
  "mcp>=1.12,<2",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "pygments>=2.19,<3",
  "starlette>=0.47,<1",
  "uvicorn>=0.35,<1",
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
cups = ["pycups>=2.0.4,<3"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
print-mcp = "print_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
